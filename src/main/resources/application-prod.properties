spring.datasource.url=jdbc:postgresql://${DATABASE_URL}:${DATABASE_PORT:5432}/${DATABASE_NAME}${DATABASE_PARAMS:}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

# En producción los secretos NO tienen valor por defecto: si faltan JWT_SECRET o ADMIN_CLAVE, la aplicación no arranca.
autorizacion.jwt.secreto=${JWT_SECRET}
semilla.admin.clave=${ADMIN_CLAVE}

# Los datos de demostración solo se cargan si se pide con SEMILLA_DEMO=true
semilla.datos-demo=${SEMILLA_DEMO:false}
